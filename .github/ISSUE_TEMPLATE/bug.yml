name: Something is wrong
description: A bug, a crash, or a finding that is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in when you come from Report an issue in Lenstica; otherwise `lenstica --version`, and your system.
      placeholder: 0.1.0 on macOS
  - type: markdown
    attributes:
      value: Please leave out anything private, such as tokens, keys or the contents of your files.
