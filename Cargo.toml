[package]
name = "lenstica"
version = "0.1.0"
edition = "2024"
description = "Security monitoring for developers, built from pluggable lenses."
homepage = "https://lenstica.com"
repository = "https://github.com/lenstica/lenstica"
license = "Apache-2.0"

[[bin]]
name = "lenstica"
path = "src/main.rs"

[workspace]
members = ["crates/*"]

[dependencies]
lenstica-lens = { path = "crates/lenstica-lens" }
lenstica-secrets = { path = "crates/lenstica-secrets", optional = true }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
resvg = { version = "0.49.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
wait-timeout = "0.2.1"
regex = "1.13.1"
walkdir = "2.5.0"
which = "8.0.6"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "=2.5.0", optional = true }

[features]
default = ["tray", "secrets"]
# The exposed-secrets lens, a plugin crate built on the public lens API.
secrets = ["dep:lenstica-secrets"]
# Menu bar app and window, built on Tauri. On Linux this needs the GTK 3,
# libayatana-appindicator and WebKitGTK development packages.
tray = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager", "dep:resvg"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications attributed to Lenstica.app, so they show its icon.
mac-notification-sys = "0.6.15"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
