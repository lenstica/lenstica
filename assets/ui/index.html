<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lenstica</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e4e7ec; --text: #101828; --muted: #667085; --soft: #f2f4f7;
    --accent: #4f46e5; --accent-soft: #eef2ff; --ok: #12b76a; --ok-soft: #ecfdf3;
    --critical: #d92d20; --high: #f76808; --medium: #e09400; --low: #2e7cf6; --info: #8e8e93;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e7e9ee; --muted: #98a2b3; --soft: #1f2430;
      --accent: #8b8cf8; --accent-soft: #23233d; --ok: #32d583; --ok-soft: #10261b;
      --critical: #ff6b5e; --high: #ff8b3e; --medium: #fdb022; --low: #5e9ef8; --info: #8e8e93;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  svg { width: 16px; height: 16px; flex: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; padding: 2px 10px 16px; }
  .brand svg { width: 20px; height: 20px; color: var(--accent); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; text-align: left; color: var(--muted); }
  .nav-item:hover { background: var(--soft); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 99px; background: var(--high); color: #fff; }
  .nav-foot { margin-top: auto; color: var(--muted); font-size: 11px; padding: 0 10px; }
  main { overflow: auto; padding: 24px 28px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: -.01em; }
  h2 { font-size: 14px; margin: 26px 0 10px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.heading { margin: 26px 0 10px; }
  .row.heading h2 { margin: 0; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .hero { padding: 18px 20px; display: flex; align-items: center; gap: 16px; }
  .hero .icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
  .hero .icon svg { width: 22px; height: 22px; }
  .hero.ok .icon { background: var(--ok-soft); color: var(--ok); }
  .hero.bad .icon { background: color-mix(in srgb, var(--high) 14%, transparent); color: var(--high); }
  .hero .title { font-size: 16px; font-weight: 650; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip .sev svg { width: 15px; height: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .tile:hover { border-color: var(--muted); }
  .tile .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tile .summary { color: var(--muted); font-size: 12px; min-height: 34px; }
  .tile .meta { color: var(--muted); font-size: 11px; display: flex; gap: 10px; align-items: center; }
  .state { width: 9px; height: 9px; border-radius: 50%; }
  .state.ok { background: var(--ok); } .state.bad { background: var(--high); } .state.err { background: var(--medium); }
  .state.worst-critical { background: var(--critical); } .state.worst-high { background: var(--high); }
  .state.worst-medium { background: var(--medium); } .state.worst-low { background: var(--low); }
  .state.idle { background: var(--line); } .state.run { background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  .sev { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 12px; font-weight: 600; }
  .sev svg { width: 16px; height: 16px; }
  .sev.critical { color: var(--critical); } .sev.high { color: var(--high); } .sev.medium { color: var(--medium); }
  .sev.low { color: var(--low); } .sev.info { color: var(--info); }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; color: #fff; }
  .sev-critical { background: var(--critical); } .sev-high { background: var(--high); } .sev-medium { background: var(--medium); }
  .sev-low { background: var(--low); } .sev-info { background: var(--info); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); flex: 1; min-width: 220px; }
  .search input { border: 0; outline: 0; background: none; color: var(--text); font: inherit; width: 100%; }
  select, input[type=number], textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .split { display: grid; grid-template-columns: minmax(320px, 44%) 1fr; gap: 12px; height: calc(100vh - 170px); }
  .list { overflow: auto; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .item:hover { background: var(--soft); }
  .item.sel { background: var(--accent-soft); }
  .item .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; }
  .item .m { grid-column: 2; color: var(--muted); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .detail { overflow: auto; padding: 18px 20px; }
  .detail h3 { margin: 8px 0 4px; font-size: 16px; }
  .detail .meta { color: var(--muted); font-size: 12px; }
  .detail pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--soft); padding: 10px 12px; border-radius: 8px; margin: 12px 0; }
  .remedy { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; margin: 12px 0; }
  .locs { list-style: none; padding: 0; margin: 6px 0; }
  .locs li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .locs li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; word-break: break-all; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .lens { padding: 14px 16px; margin-bottom: 10px; }
  .lens .head { display: flex; align-items: center; gap: 10px; }
  .lens .head .name { font-weight: 600; }
  .lens .desc { color: var(--muted); margin: 6px 0; }
  .lens details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .lens details li { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; cursor: pointer; }
  .switch span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span:before { transform: translateX(14px); }
  .form { padding: 6px 18px; margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field > label:not(.switch) { flex: 1; }
  .field textarea { width: 320px; min-height: 64px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .field input[type=number] { width: 90px; }
  .field .note { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .field.indent { padding-left: 22px; }
  .field.off { opacity: .45; }
  .tag.rec { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .tag.rec svg { width: 12px; height: 12px; }
  .field code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
  .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 9; }
  .toast { background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 9px; max-width: 440px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.bad { background: var(--critical); color: #fff; }
  .muted { color: var(--muted); }
</style>
</head>

    <div class="nav-foot" id="foot"></div>
  </nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div class="toasts" id="toasts"></div>
