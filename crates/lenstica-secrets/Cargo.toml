[package]
name = "lenstica-secrets"
version = "0.1.0"
edition = "2024"
description = "Lenstica lens: credentials on disk that malware running as you could steal"
license = "Apache-2.0"
repository = "https://github.com/lenstica/lenstica"

[dependencies]
